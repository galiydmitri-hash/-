<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Історія України</title>
</head>
<body>
    <header>
        <button class="dashboard-btn console-btn">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none"
                xmlns="http://www.w3.org/2000/svg">
                <rect x="3.5" y="3.5" width="10" height="7" rx="1.5"
                    fill="#d1d5db"/>
                <rect x="16" y="3.5" width="4.5" height="7" rx="1.5"
                    fill="#d1d5db"/>
                <rect x="3.5" y="13.5" width="5" height="7" rx="1.5"
                    fill="#d1d5db"/>
                <rect x="11.5" y="13.5" width="9" height="7" rx="1.5"
                    fill="#d1d5db"/>
            </svg>
        </button>
        <button class="add-btn console-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" viewBox="0 0 24 24" fill="none">
                <path
                    d="M12 5V19M5 12H19"
                    stroke="#d1d5db"
                    stroke-width="1.8"
                    stroke-linecap="round"
                />
            </svg>
        </button>
        <button class="list-btn console-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" viewBox="0 0 24 24" fill="none">
                <path
                    d="M7 15L12 10L17 15"
                    stroke="#d1d5db"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />
            </svg>
        </button>
        <ul class="list"></ul>
    </header>

    <div class="main-container">
        <div class="dashboard">
            <button class="topic-list-btn btn">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M3 10.8L12 3L21 10.8V20C21 20.55 20.55 21 20 21H15V15H9V21H4C3.45 21 3 20.55 3 20V10.8Z"
                        stroke="#d1d5db"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>
            </button>
            
            <!-- Кнопка переключателя AI в дашборде (с обновленной иконкой AI-искры) -->
            <button class="ai-btn btn" title="AI Історик-Асистент">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" stroke="#d1d5db" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>

        <div class="secondary-container">
                <div class="ai-chat-window">
                    <div class="ai-chat-container">
                        <div class="ai-chat-header">
                            <span>AI Історик-Асистент</span>
                        </div>
                        <div class="ai-chat-messages" id="aiMessages">
                            <div class="ai-message bot">Привіт! Я можу знайти інформацію про будь-яку історичну подію та за запитом одразу створити картку. Про що дізнаємось?</div>
                        </div>
                        <div class="ai-chat-input-area">
                            <input type="text" id="aiInput" placeholder="Наприклад: Знайди інформацію про Кирилло-Мефодіївське братство...">
                            <button id="aiSendBtn">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M2.01 21L23 12L2.01 3L2 10L17 12L2 14L2.01 21Z" fill="#ffffff"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="topic-list"></div>
        </div>
    </div>

    <div class="bg"></div>

    <div class="add-new-topic">
        <button class="close-btn">            
            <svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" viewBox="0 0 24 24" fill="none">
                <path
                    d="M12 5V19M5 12H19"
                    stroke="#d1d5db"
                    stroke-width="1.8"
                    stroke-linecap="round"
                />
            </svg>
        </button>
        <input type="text" class="inputForList" placeholder="Назва списку">
        <textarea class="inputForMain" placeholder="Основная информация"></textarea>
        <textarea class="inputForSecondary" placeholder="Вторичная информация"></textarea>
        <button class="add-new-topic-btn">Додати</button>
    </div>

    <script type="module" src="index.js"></script>
</body>
</html>
